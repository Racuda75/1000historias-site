<head>

<style>
@font-face{font-family:"Baskervville";font-style:normal;font-weight:400;font-display:swap;src:url(/assets/fonts/font-7391cf1c.woff2) format("woff2")}
@font-face{font-family:"Baskervville";font-style:italic;font-weight:400;font-display:swap;src:url(/assets/fonts/font-d82af4a3.woff2) format("woff2")}
@font-face{font-family:"Jost";font-style:normal;font-weight:400;font-display:swap;src:url(/assets/fonts/font-b9287b43.woff2) format("woff2")}
@font-face{font-family:"Jost";font-style:normal;font-weight:700;font-display:swap;src:url(/assets/fonts/font-f0ea2838.woff2) format("woff2")}
:root{--wine:#5a2a27;--cream:#f8f7f5;--ink:#191919;--gold:#cfaf6e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--wine);color:var(--cream);font-family:"Jost",system-ui,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--cream)}
a:hover{color:var(--gold)}
.page{position:relative;min-height:100vh;min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
.bg{position:absolute;inset:0;background:url(/assets/images/cms-NoYITOMLwzCLZGxGfR8O8fXx8.jpg) center/cover no-repeat;transform:scale(1.04);animation:drift 24s ease-in-out infinite alternate}
.bg::after{content:"";position:absolute;inset:0;background:rgba(25,25,25,.55)}
@keyframes drift{to{transform:scale(1.1)}}
header,main,footer{position:relative;z-index:1;width:100%;max-width:1200px;margin:0 auto;padding:0 32px}
header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-top:28px;padding-bottom:28px}
header img{display:block;width:150px;height:auto}
.lang{display:flex;gap:4px;border:1px solid rgba(248,247,245,.45);border-radius:999px;padding:4px}
.lang button{font:inherit;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--cream);background:transparent;border:0;border-radius:999px;padding:6px 14px;min-height:32px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--cream);color:var(--wine)}
main{display:flex;flex-direction:column;justify-content:center;gap:28px;padding-top:24px;padding-bottom:64px}
.code{font-family:"Baskervville",Georgia,serif;font-style:italic;font-size:clamp(96px,18vw,220px);line-height:.9;color:var(--gold)}
h1{font-family:"Baskervville",Georgia,serif;font-weight:400;font-size:clamp(34px,5vw,60px);line-height:1.1;max-width:15ch;text-wrap:balance}
h1 em{font-style:italic}
p.lead{max-width:46ch;font-size:clamp(17px,1.6vw,20px);text-wrap:pretty}
.actions{display:flex;flex-wrap:wrap;gap:12px;padding-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;border-radius:999px;font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;transition:background .2s,color .2s,border-color .2s}
.btn.primary{background:var(--cream);color:var(--wine)}
.btn.primary:hover{background:var(--gold);color:var(--ink)}
.btn.ghost{border:1px solid rgba(248,247,245,.7);color:var(--cream)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;padding-top:24px;padding-bottom:28px;border-top:1px solid rgba(248,247,245,.25);font-size:14px}
footer a{text-decoration:none}
@media (max-width:600px){header,main,footer{padding-left:20px;padding-right:20px}header img{width:120px}}
@media (prefers-reduced-motion:reduce){.bg{animation:none}}
</style>
</head>
<body>
<div class="page">
  <div class="bg" role="img" aria-label="Viñedo en Mendoza con los Andes de fondo"></div>
  <header>
    <a href="/" data-home><img src="/assets/images/logo-1000historias.svg" alt="1000 Historias" width="228" height="57"></a>
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button type="button" data-set-lang="es" aria-pressed="true">ES</button>
      <button type="button" data-set-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <h1 data-t="title">Esta historia <em>todavía no fue escrita.</em></h1>
    <p class="lead" data-t="lead">La página que buscás no existe o cambió de lugar. Volvé al inicio y seguí descubriendo cómo crear un vino que cuente tu historia.</p>
    <div class="actions">
      <a class="btn primary" href="/" data-home data-t="home">Volver al inicio</a>
      <a class="btn ghost" href="/ocasiones" data-occ data-t="occ">Ver ocasiones</a>
    </div>
  </main>
  <footer>
    <span data-t="copy">©1000 Historias, 2025 · Mendoza, Argentina</span>
    <a href="mailto:buenasysantas@1000historias.com">buenasysantas@1000historias.com</a>
  </footer>
</div>
<script>
(function(){
  var T={
    es:{doc:"404 – Página no encontrada | 1000 Historias",title:"Esta historia <em>todavía no fue escrita.</em>",lead:"La página que buscás no existe o cambió de lugar. Volvé al inicio y seguí descubriendo cómo crear un vino que cuente tu historia.",home:"Volver al inicio",occ:"Ver ocasiones",copy:"©1000 Historias, 2025 · Mendoza, Argentina",homeUrl:"/",occUrl:"/ocasiones",lang:"es-AR",bg:"Viñedo en Mendoza con los Andes de fondo"},
    en:{doc:"404 – Page not found | 1000 Historias",title:"This story <em>hasn’t been written yet.</em>",lead:"The page you’re looking for doesn’t exist or has moved. Head back home and keep discovering how to create a wine that tells your story.",home:"Back to home",occ:"See occasions",copy:"©1000 Historias, 2025 · Mendoza, Argentina",homeUrl:"/en/",occUrl:"/en/ocasiones",lang:"en",bg:"Vineyard in Mendoza with the Andes in the background"}
  };
  function set(l){
    var t=T[l]||T.es;
    document.documentElement.lang=t.lang;document.title=t.doc;
    document.querySelectorAll("[data-t]").forEach(function(el){el.innerHTML=t[el.getAttribute("data-t")]});
    document.querySelectorAll("[data-home]").forEach(function(el){el.href=t.homeUrl});
    document.querySelectorAll("[data-occ]").forEach(function(el){el.href=t.occUrl});
    document.querySelector(".bg").setAttribute("aria-label",t.bg);
    document.querySelectorAll("[data-set-lang]").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-set-lang")===l?"true":"false")});
  }
  document.querySelectorAll("[data-set-lang]").forEach(function(b){b.addEventListener("click",function(){set(b.getAttribute("data-set-lang"))})});
  var p=location.pathname.toLowerCase();
  set(/^\/en(\/|$)/.test(p)?"en":"es");
})();
</script>
</body>
</html>
